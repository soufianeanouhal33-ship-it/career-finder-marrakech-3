<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Finder Marrakech</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Écran de connexion / inscription -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <h1>🎯 Career Finder</h1>
    <p class="muted">Entreprises, offres et candidatures IA &amp; IT à Marrakech.</p>
    <div class="tabs" role="tablist">
      <button class="tab active" data-auth-tab="login" type="button">Connexion</button>
      <button class="tab" data-auth-tab="register" type="button">Créer un compte</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <label>Nom d'utilisateur
        <input name="username" required minlength="3" maxlength="32" autocomplete="username">
      </label>
      <label>Mot de passe
        <input name="password" type="password" required minlength="8" autocomplete="current-password">
      </label>
      <label id="confirm-row" hidden>Confirmer le mot de passe
        <input name="confirm" type="password" autocomplete="new-password">
      </label>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <button class="btn primary block" type="submit" id="auth-submit">Se connecter</button>
    </form>
  </div>
</section>

<!-- Application -->
<div id="app" class="layout" hidden>
  <aside class="sidebar">
    <div class="brand">🎯 <span>Career Finder</span><small>Marrakech · IA &amp; IT</small></div>
    <nav id="nav">
      <a href="#/accueil" data-route="accueil">🏠 <span>Accueil</span></a>
      <a href="#/entreprises" data-route="entreprises">🏢 <span>Entreprises</span></a>
      <a href="#/offres" data-route="offres">📄 <span>Offres</span></a>
      <a href="#/carte" data-route="carte">🗺️ <span>Carte</span></a>
      <a href="#/candidatures" data-route="candidatures">📬 <span>Candidatures</span></a>
      <a href="#/statistiques" data-route="statistiques">📊 <span>Statistiques</span></a>
      <a href="#/profil" data-route="profil">🎯 <span>Profil &amp; Matching</span></a>
      <a href="#/donnees" data-route="donnees">⚙️ <span>Collecte &amp; Import</span></a>
    </nav>
    <div class="userbox">
      <div>👤 <strong id="user-name"></strong> <span id="user-role" class="chip"></span></div>
      <button class="btn ghost small" id="logout" type="button">Se déconnecter</button>
    </div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<dialog id="modal"></dialog>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="/js/core.js" defer></script>
<script src="/js/pages-a.js" defer></script>
<script src="/js/pages-b.js" defer></script>
<script src="/js/main.js" defer></script>
</body>
</html>
